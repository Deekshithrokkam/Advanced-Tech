<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="#f5f5f5"/>
  
  <!-- Outer red ring -->
  <circle cx="256" cy="256" r="245" fill="none" stroke="#d32f2f" stroke-width="12"/>
  
  <!-- Dark red background -->
  <circle cx="256" cy="256" r="233" fill="#8B1A1A"/>
  
  <!-- Inner red ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#d32f2f" stroke-width="8"/>
  
  <!-- Shield shape -->
  <path d="M 256 140 L 340 180 L 340 260 Q 256 320 256 320 Q 256 320 172 260 L 172 180 Z" 
        fill="none" stroke="#d32f2f" stroke-width="8" stroke-linejoin="round"/>
  
  <!-- Shield background -->
  <path d="M 256 145 L 335 183 L 335 258 Q 256 310 256 310 Q 256 310 177 258 L 177 183 Z" 
        fill="#8B1A1A"/>
  
  <!-- Circuit lines on left -->
  <line x1="160" y1="160" x2="150" y2="150" stroke="#d32f2f" stroke-width="4" stroke-linecap="round"/>
  <circle cx="150" cy="150" r="5" fill="none" stroke="#d32f2f" stroke-width="3"/>
  
  <line x1="160" y1="210" x2="140" y2="210" stroke="#d32f2f" stroke-width="4" stroke-linecap="round"/>
  <circle cx="140" cy="210" r="5" fill="none" stroke="#d32f2f" stroke-width="3"/>
  
  <line x1="160" y1="260" x2="140" y2="275" stroke="#d32f2f" stroke-width="4" stroke-linecap="round"/>
  <circle cx="140" cy="275" r="5" fill="none" stroke="#d32f2f" stroke-width="3"/>
  
  <!-- Circuit lines on right -->
  <line x1="352" y1="160" x2="362" y2="150" stroke="#d32f2f" stroke-width="4" stroke-linecap="round"/>
  <circle cx="362" cy="150" r="5" fill="none" stroke="#d32f2f" stroke-width="3"/>
  
  <line x1="352" y1="210" x2="372" y2="210" stroke="#d32f2f" stroke-width="4" stroke-linecap="round"/>
  <circle cx="372" cy="210" r="5" fill="none" stroke="#d32f2f" stroke-width="3"/>
  
  <line x1="352" y1="260" x2="372" y2="275" stroke="#d32f2f" stroke-width="4" stroke-linecap="round"/>
  <circle cx="372" cy="275" r="5" fill="none" stroke="#d32f2f" stroke-width="3"/>
  
  <!-- Internal grid for shield -->
  <line x1="256" y1="155" x2="256" y2="290" stroke="#d32f2f" stroke-width="6"/>
  <line x1="200" y1="225" x2="312" y2="225" stroke="#d32f2f" stroke-width="6"/>
  
  <!-- N I letters -->
  <text x="225" y="245" font-family="Georgia, serif" font-size="60" font-weight="bold" fill="#F5DEB3" text-anchor="middle">N</text>
  <text x="287" y="245" font-family="Georgia, serif" font-size="60" font-weight="bold" fill="#F5DEB3" text-anchor="middle">I</text>
  
  <!-- A T letters -->
  <text x="225" y="295" font-family="Georgia, serif" font-size="60" font-weight="bold" fill="#F5DEB3" text-anchor="middle">A</text>
  <text x="287" y="295" font-family="Georgia, serif" font-size="60" font-weight="bold" fill="#F5DEB3" text-anchor="middle">T</text>
  
  <!-- Text arc - "ADVANCED" at top -->
  <defs>
    <path id="topArc" d="M 150,256 A 106,106 0 0,1 362,256" fill="none"/>
  </defs>
  <text font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#F5DEB3" letter-spacing="3">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">
      ADVANCED
    </textPath>
  </text>
  
  <!-- Text arc - "TECH CLUB" at bottom -->
  <defs>
    <path id="bottomArc" d="M 362,256 A 106,106 0 0,1 150,256" fill="none"/>
  </defs>
  <text font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#F5DEB3" letter-spacing="3">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">
      TECH CLUB
    </textPath>
  </text>
</svg>