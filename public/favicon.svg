<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Light background -->
  <rect width="512" height="512" fill="#f0f0f0"/>
  
  <!-- Outer bright red circle -->
  <circle cx="256" cy="256" r="252" fill="none" stroke="#d32f2f" stroke-width="20"/>
  
  <!-- Dark maroon background circle -->
  <circle cx="256" cy="256" r="242" fill="#8B1A1A"/>
  
  <!-- Inner red ring -->
  <circle cx="256" cy="256" r="232" fill="none" stroke="#d32f2f" stroke-width="10"/>
  
  <!-- Shield outline -->
  <path d="M 256 160 L 330 200 L 330 280 Q 256 340 256 340 Q 256 340 182 280 L 182 200 Z" 
        fill="none" stroke="#d32f2f" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
  
  <!-- Shield internal lines forming grid -->
  <line x1="256" y1="170" x2="256" y2="330" stroke="#d32f2f" stroke-width="8"/>
  <line x1="190" y1="250" x2="322" y2="250" stroke="#d32f2f" stroke-width="8"/>
  
  <!-- Left circuit lines with dots -->
  <line x1="155" y1="190" x2="175" y2="170" stroke="#d32f2f" stroke-width="5" stroke-linecap="round"/>
  <circle cx="175" cy="170" r="7" fill="none" stroke="#d32f2f" stroke-width="4"/>
  
  <line x1="140" y1="240" x2="175" y2="240" stroke="#d32f2f" stroke-width="5" stroke-linecap="round"/>
  <circle cx="140" cy="240" r="7" fill="none" stroke="#d32f2f" stroke-width="4"/>
  
  <line x1="145" y1="290" x2="170" y2="310" stroke="#d32f2f" stroke-width="5" stroke-linecap="round"/>
  <circle cx="170" cy="310" r="7" fill="none" stroke="#d32f2f" stroke-width="4"/>
  
  <!-- Right circuit lines with dots -->
  <line x1="357" y1="190" x2="337" y2="170" stroke="#d32f2f" stroke-width="5" stroke-linecap="round"/>
  <circle cx="337" cy="170" r="7" fill="none" stroke="#d32f2f" stroke-width="4"/>
  
  <line x1="372" y1="240" x2="337" y2="240" stroke="#d32f2f" stroke-width="5" stroke-linecap="round"/>
  <circle cx="372" cy="240" r="7" fill="none" stroke="#d32f2f" stroke-width="4"/>
  
  <line x1="367" y1="290" x2="342" y2="310" stroke="#d32f2f" stroke-width="5" stroke-linecap="round"/>
  <circle cx="342" cy="310" r="7" fill="none" stroke="#d32f2f" stroke-width="4"/>
  
  <!-- Additional middle circuit lines -->
  <line x1="160" y1="240" x2="140" y2="220" stroke="#d32f2f" stroke-width="5" stroke-linecap="round"/>
  <circle cx="140" cy="220" r="7" fill="none" stroke="#d32f2f" stroke-width="4"/>
  
  <line x1="352" y1="240" x2="372" y2="220" stroke="#d32f2f" stroke-width="5" stroke-linecap="round"/>
  <circle cx="372" cy="220" r="7" fill="none" stroke="#d32f2f" stroke-width="4"/>
  
  <!-- N I letters in shield -->
  <text x="230" y="270" font-family="Georgia, serif" font-size="70" font-weight="bold" fill="#F5DEB3" text-anchor="middle">N</text>
  <text x="282" y="270" font-family="Georgia, serif" font-size="70" font-weight="bold" fill="#F5DEB3" text-anchor="middle">I</text>
  
  <!-- A T letters in shield -->
  <text x="230" y="315" font-family="Georgia, serif" font-size="70" font-weight="bold" fill="#F5DEB3" text-anchor="middle">A</text>
  <text x="282" y="315" font-family="Georgia, serif" font-size="70" font-weight="bold" fill="#F5DEB3" text-anchor="middle">T</text>
  
  <!-- Top text arc - ADVANCED -->
  <defs>
    <path id="topArc" d="M 140,256 A 116,116 0 0,1 372,256" fill="none"/>
  </defs>
  <text font-family="Georgia, serif" font-size="38" font-weight="bold" fill="#F5DEB3" letter-spacing="2">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">
      ADVANCED
    </textPath>
  </text>
  
  <!-- Bottom text arc - TECH CLUB -->
  <defs>
    <path id="bottomArc" d="M 372,256 A 116,116 0 0,1 140,256" fill="none"/>
  </defs>
  <text font-family="Georgia, serif" font-size="38" font-weight="bold" fill="#F5DEB3" letter-spacing="2">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">
      TECH CLUB
    </textPath>
  </text>
</svg>